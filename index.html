<style>
/* Layout: eine Spalte wie ein Lagebericht – Kopf mit Datum, Filterleiste, Meldungskarten, Tableiste unten */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14243a; --muted:#5d6b7e; --line:#dde3ea;
  --accent:#c98a0c; --accent-ink:#ffffff; --signal:#14243a; --danger:#b3261e; --ok:#2e7d4f;
  --swipe:#e7ebf0;
  --c-politik:#2f5aa8; --c-wirtschaft:#2e7d6b; --c-wissenschaft:#7a4fb3; --c-technik:#0f7891;
  --c-sport:#b45a1c; --c-kultur:#a83d6b; --c-gesundheit:#3b8a3e; --c-panorama:#6b6b7a; --c-regional:#b5841a; --c-vermischtes:#6b7686;
  --f-head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1520; --surface:#16212f; --ink:#e6ebf2; --muted:#93a1b3; --line:#243244;
  --accent:#f2c44d; --accent-ink:#14243a; --signal:#e6ebf2; --danger:#ff8a80; --ok:#7fd1a0; --swipe:#1e2b3b;
  --c-politik:#7fa4ec; --c-wirtschaft:#6cc7b0; --c-wissenschaft:#b99ae6; --c-technik:#5cc2da;
  --c-sport:#f0a06a; --c-kultur:#ec8fb6; --c-gesundheit:#86cf88; --c-panorama:#aeb0c0; --c-regional:#f2c44d; --c-vermischtes:#a3adbb;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1520; --surface:#16212f; --ink:#e6ebf2; --muted:#93a1b3; --line:#243244;
  --accent:#f2c44d; --accent-ink:#14243a; --signal:#e6ebf2; --danger:#ff8a80; --ok:#7fd1a0; --swipe:#1e2b3b;
  --c-politik:#7fa4ec; --c-wirtschaft:#6cc7b0; --c-wissenschaft:#b99ae6; --c-technik:#5cc2da;
  --c-sport:#f0a06a; --c-kultur:#ec8fb6; --c-gesundheit:#86cf88; --c-panorama:#aeb0c0; --c-regional:#f2c44d; --c-vermischtes:#a3adbb;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));min-height:100vh}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{padding-block:14px 8px;display:flex;align-items:flex-end;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 28px/1.05 var(--f-head);letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.stamp{margin-top:4px;font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cat,var(--muted))}
.chip .n{font:500 11px var(--f-mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--signal);color:var(--bg);border-color:var(--signal)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.progress{height:2px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* Liste */
main .wrap{padding-block:6px 24px;display:flex;flex-direction:column;gap:10px}
.slot{position:relative;border-radius:var(--r);transition:height .25s ease,margin .25s ease,opacity .25s}
.slot .under{position:absolute;inset:0;border-radius:var(--r);background:var(--swipe);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--muted);font-size:13px;font-weight:600}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.card.anim{transition:transform .25s ease}
.meta{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meta .cat{color:var(--cat);display:flex;align-items:center;gap:6px}
.meta .cat::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cat)}
.meta .sp{flex:1}
.pin{width:36px;height:36px;margin:-10px -8px -10px 0;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.pin svg{width:19px;height:19px}
.pin[aria-pressed="true"]{color:var(--accent)}
.card h2{margin:8px 0 0;font:600 19px/1.25 var(--f-head);text-wrap:balance;letter-spacing:-.005em}
.card h2 a{color:inherit;text-decoration:none}
.card p{margin:6px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.srcs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.src{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:500;text-decoration:none;color:var(--ink);background:var(--bg)}
.src time{font:500 11px var(--f-mono);color:var(--muted)}
.multi{font:500 11px var(--f-mono);color:var(--accent);letter-spacing:.04em}
.foot{margin-top:8px;font:500 11px var(--f-mono);color:var(--muted);display:flex;gap:6px}
.empty{padding:48px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;font:600 19px var(--f-head);color:var(--ink);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 0 2px}

/* Einstellungen */
.sect{margin-top:8px}
.sect h3{margin:18px 4px 8px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.status{font:500 11px var(--f-mono);white-space:nowrap}
.status.ok{color:var(--ok)} .status.err{color:var(--danger)} .status.idle{color:var(--muted)}
.del{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.del svg{width:17px;height:17px}
.form{display:grid;gap:10px;padding:14px}
.form input,.form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;background:var(--signal);color:var(--bg)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}
.note{font-size:12.5px;color:var(--muted);padding:8px 4px 0}
.err-msg{color:var(--danger);font-size:13px}

/* Tableiste & Toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.day{margin:14px 4px 2px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day:first-child{margin-top:4px}
.read-at{color:var(--ok)}

<script>
"use strict";
/* ---------- Grunddaten ---------- */
const CATS = ["Politik","Wirtschaft","Wissenschaft","Technik","Gesundheit","Sport","Kultur","Panorama","Regional","Vermischtes"];
const CAT_VAR = c => "var(--c-" + c.toLowerCase() + ")";
const GN = q => "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=de&gl=DE&ceid=DE:de";

const DEFAULT_SOURCES = [
  {id:"tagesschau", name:"Tagesschau", url:"https://www.tagesschau.de/index~rss2.xml", cat:"auto", group:"Überregional", on:true},

  {id:"wdr-wl", name:"WDR · Westfalen-Lippe", url:"https://www1.wdr.de/nachrichten/westfalen-lippe/uebersicht-westfalen-lippe-100.feed", cat:"Regional", group:"Regional", on:true},
  {id:"gn-owl", name:"OWL (Google News)", url:GN("Ostwestfalen OR Bielefeld OR Paderborn OR Gütersloh OR Herford OR Detmold OR Lippstadt when:2d"), cat:"Regional", group:"Regional", on:true},
  {id:"gn-soest", name:"Kreis Soest & Hamm (Google News)", url:GN("Welver OR Werl OR Soest OR Hamm Westfalen when:2d"), cat:"Regional", group:"Regional", on:true}
];

/* Ersatzweg für Quellen, die (noch) nicht vom GitHub-Abruf geholt werden */
const PROXIES = {
  allorigins: Object.assign(u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u), {json:true}),
  allorigins_raw: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  codetabs: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
};

/* ---------- Speicher ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("lagebild:" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("lagebild:" + k, JSON.stringify(v)); }catch(e){} }
};
let settings = Object.assign({theme:"system", open:"original", hours:24, merge:true, hideSport:true, proxy:"auto", customProxy:""}, store.get("settings", {}));
let sources = store.get("sources", null) || DEFAULT_SOURCES.map(s => ({...s}));
let dismissed = store.get("dismissed", {});          // link -> Zeitstempel
let pins = store.get("pins", []);                     // gespeicherte Cluster
/* Lernprotokoll für spätere Auswertung: was weggewischt (uninteressant) und was gelesen (interessant) wurde */
let swipeLog = store.get("log:swiped", []), readLog = store.get("log:read", []);
function logEntry(c){ return {t:c.title, x:(c.teaser || "").slice(0, 200), c:c.cat, s:[...new Set(c.items.map(i => i.name))], n:c.items.length, at:Date.now()}; }
function saveLogs(){
  const limit = Date.now() - 180 * 86400e3;
  swipeLog = swipeLog.filter(e => e.at >= limit).slice(-3000); readLog = readLog.filter(e => e.at >= limit).slice(-3000);
  store.set("log:swiped", swipeLog); store.set("log:read", readLog);
}
let readList = store.get("read", []);                 // angetippte (gelesene) Cluster mit readAt – getrennt von „dismissed“ (weggewischt)
const readLinks = () => { const s = new Set(); readList.forEach(c => c.items.forEach(i => s.add(i.link))); return s; };
function saveRead(){
  const limit = Date.now() - 14 * 86400e3;
  readList = readList.filter(c => c.readAt >= limit).sort((a,b) => b.readAt - a.readAt).slice(0, 400);
  store.set("read", readList);
}
let cache = store.get("cache", {items:[], at:0, status:{}});
let proxyHint = store.get("proxyHint", {});           // Quelle -> zuletzt funktionierender Dienst
let state = {view:"feed", cat:"Alle", loading:false};
let serverInfo = {at: 0};                              // Stand der feeds.json vom GitHub-Abruf

function saveAll(){ store.set("settings", settings); store.set("sources", sources); store.set("dismissed", dismissed); store.set("pins", pins); }

/* ---------- Theme ---------- */
function applyTheme(){
  const r = document.documentElement;
  if (settings.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", settings.theme);
  requestAnimationFrame(() => {
    document.getElementById("themeColor").setAttribute("content", getComputedStyle(document.body).backgroundColor);
  });
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

/* ---------- Abruf & Parsing ---------- */
function proxyOrder(srcId){
  if (settings.proxy === "custom" && settings.customProxy) return [u => settings.customProxy + encodeURIComponent(u)];
  if (settings.proxy !== "auto" && PROXIES[settings.proxy]) return [PROXIES[settings.proxy]];
  const names = Object.keys(PROXIES);
  const hint = proxyHint[srcId];
  if (hint && names.includes(hint)) names.sort((a,b) => (b === hint) - (a === hint));
  return names.map(n => Object.assign(PROXIES[n], {pname:n}));
}
function decodeDataUrl(s){
  if (!s.startsWith("data:")) return s;
  const i = s.indexOf(","), meta = s.slice(0, i), body = s.slice(i + 1);
  if (!/;base64/.test(meta)) return decodeURIComponent(body);
  return new TextDecoder().decode(Uint8Array.from(atob(body), c => c.charCodeAt(0)));
}
async function fetchText(url, srcId){
  let lastErr;
  for (const p of proxyOrder(srcId)){
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 15000);
    try{
      const res = await fetch(p(url), {signal:ctrl.signal});
      clearTimeout(t);
      if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? "Abruf-Dienst verweigert (" + res.status + ")" : "HTTP " + res.status);
      let txt = await res.text();
      if (p.json){ const j = JSON.parse(txt); txt = decodeDataUrl(j.contents || ""); }
      if (!/<(rss|feed|rdf:RDF|channel)[\s>]/i.test(txt)) throw new Error("kein Feed");
      if (p.pname){ proxyHint[srcId] = p.pname; store.set("proxyHint", proxyHint); }
      return txt;
    }catch(e){ clearTimeout(t); lastErr = e; }
  }
  throw lastErr || new Error("nicht erreichbar");
}
const kids = (el, names) => Array.from(el.children).filter(c => names.includes(c.localName));
const kidText = (el, names) => { for (const n of names){ const k = kids(el,[n])[0]; if (k && k.textContent.trim()) return k.textContent.trim(); } return ""; };
const htmlToText = s => { if (!s) return ""; const d = new DOMParser().parseFromString(s, "text/html"); return (d.body.textContent || "").replace(/\s+/g," ").trim(); };

function parseFeed(xml, src){
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("ungültiges XML");
  const entries = Array.from(doc.getElementsByTagNameNS("*","item")).concat(Array.from(doc.getElementsByTagNameNS("*","entry")));
  const out = [];
  for (const e of entries){
    let title = htmlToText(kidText(e,["title"]));
    let link = kidText(e,["link"]);
    if (!link){ const l = kids(e,["link"]).find(x => !x.getAttribute("rel") || x.getAttribute("rel") === "alternate"); if (l) link = l.getAttribute("href") || ""; }
    if (!link) link = kidText(e,["guid","id"]);
    if (!title || !/^https?:/.test(link)) continue;
    let teaser = htmlToText(kidText(e,["description","summary","encoded","content"]));
    if (teaser.length > 260) teaser = teaser.slice(0, 250).replace(/\s\S*$/,"") + " …";
    const dateStr = kidText(e,["pubDate","date","published","updated"]);
    let date = Date.parse(dateStr); if (isNaN(date)) date = Date.now();
    const cats = kids(e,["category","subject"]).map(c => (c.textContent || c.getAttribute("term") || "").toLowerCase()).filter(Boolean);
    const s = kids(e,["source"])[0];
    out.push(finalize({title, teaser, link, date, cats, via: s ? s.textContent.trim() : ""}, src));
  }
  return out;
}
/* gemeinsame Nachbearbeitung – für Feeds aus dem Browser und aus feeds.json */
function finalize(r, src){
  let {title, teaser, link, date} = r, via = "";
  teaser = teaser || "";
  if (teaser.length > 260) teaser = teaser.slice(0, 250).replace(/\s\S*$/,"") + " …";
  if (/news\.google\./.test(src.url)){
    via = r.via || "";
    if (via && title.endsWith(" - " + via)) title = title.slice(0, -(via.length + 3));
    if (teaser.startsWith(title)) teaser = "";
  }
  if (teaser && teaser.toLowerCase() === title.toLowerCase()) teaser = "";
  return {title, teaser, link, date: date || Date.now(), src:src.id, srcName:src.name, via, cat: detectCat(src, link, r.cats || [])};
}
async function loadSnapshot(){
  try{
    const res = await fetch("feeds.json?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) return null;
    const j = await res.json();
    return j && j.feeds ? j : null;
  }catch(e){ return null; }
}

const CAT_KEYS = [
  ["Sport", ["sport","fussball","bundesliga","formel1","formel-1","olympia","bvb","tennis"]],
  ["Gesundheit", ["gesundheit","medizin","pflege"]],
  ["Wissenschaft", ["wissenschaft","wissen","forschung","klima","umwelt","natur","weltraum"]],
  ["Technik", ["digital","netzwelt","technik","tech","computer","mobilitaet","auto","games","it","security","software","hardware"]],
  ["Wirtschaft", ["wirtschaft","finanzen","geld","boerse","unternehmen","verbraucher","karriere","job"]],
  ["Politik", ["politik","inland","ausland","deutschland","welt","international","europa","investigativ","bundestag","nahost","ukraine"]],
  ["Kultur", ["kultur","kino","film","musik","literatur","buecher","medien","kunst","fernsehen","tv"]],
  ["Regional", ["lokales","nordrhein-westfalen","nrw","region","westfalen"]],
  ["Panorama", ["panorama","vermischtes","gesellschaft","leben","stars","stil","reise","boulevard","promis","liebe","familie","entdecken"]]
];
function detectCat(src, link, feedCats){
  if (src.cat && src.cat !== "auto") return src.cat;
  let segs = [];
  try{ segs = new URL(link).pathname.toLowerCase().split("/").filter(Boolean).slice(0,2); }catch(e){}
  for (const [cat, keys] of CAT_KEYS){ if (segs.some(s => keys.includes(s))) return cat; }
  for (const fc of feedCats){ for (const [cat, keys] of CAT_KEYS){ if (keys.some(k => fc === k || fc.includes(k) && k.length > 4)) return cat; } }
  return src.fallback || "Vermischtes";
}

/* ---------- Sport erkennen ---------- */
const SPORT_WORDS = new RegExp("(^|[^a-z])(" + [
  "sport(?!s?wagen)", "fussball", "bundesliga", "liga", "kreisliga", "bezirksliga", "landesliga", "oberliga", "westfalenliga",
  "champions league", "europa league", "conference league", "dfb", "uefa", "fifa", "pokal", "spieltag", "tabellenf", "tabellenletzt",
  "abstiegs", "aufsteiger", "torjaeger", "torwart", "torhueter", "elfmeter", "halbzeit", "schiedsrichter", "trainer",
  "handball", "basketball", "volleyball", "eishockey", "tischtennis", "tennis", "badminton", "leichtathlet", "marathon", "triathlon",
  "radrennen", "tour de france", "formel[ -]1", "formel-1", "grand prix", "motogp", "ski[ -]alpin", "biathlon", "skisprung", "skispring",
  "olympi", "paralympi", "weltcup", "weltmeister", "europameister", "meisterschaft", "turnier", "derby", "kader", "transferfenster",
  "stuermer", "mittelfeld", "kunstrasen", "sportplatz", "heimsieg", "auswaertssieg", "heimspiel", "auswaertsspiel", "punktspiel",
  "testspiel", "relegation", "golfplatz", "golfturnier", "reitturnier", "stadtlauf", "volkslauf", "firmenlauf", "spendenlauf",
  "eisstock", "kegel", "bowling", "judo", "karate", "boxkampf", "boxer", "nba", "nfl", "nhl", "super bowl",
  "bvb", "schalke", "borussia", "bayern muenchen", "fc bayern", "rb leipzig", "eintracht frankfurt", "arminia", "sc paderborn",
  "vfl bochum", "sc verl", "rot-weiss essen", "preussen muenster", "hammer spvg", "spvg", "werder bremen", "hertha", "1\\. fc"
].join("|") + ")");
const SPORT_CLUB = /(^|[\s(„"'])(SV|TuS|TSV|SuS|FC|SC|VfB|VfL|SpVg|SpVgg|DJK|BSV|TuRa|SSV|RSV|SVE|SVF|SVW|HSV|BVB|SG)(?=[\s,:)–-]|$)/;
const SPORT_VIA = /sport|kicker|fupa|transfermarkt|11freunde|ran\.de|sport1|laola/i;
function scoreMatch(text){
  const re = /(^|[\s(])(\d{1,2}):(\d{1,2})(?=[\s),.!?;]|$)(?!\s*Uhr)/g; let m;
  while ((m = re.exec(text))){ if (+m[2] <= 15 && +m[3] <= 15) return true; }
  return false;
}
function isSport(it){
  if (it.cat === "Sport") return true;
  let path = "";
  try{ const u = new URL(it.link); if (!/news\.google\./.test(u.hostname)) path = u.pathname.toLowerCase(); }catch(e){}
  if (/sport|fussball|bundesliga|formel1|handball/.test(path)) return true;
  if (it.via && SPORT_VIA.test(it.via)) return true;
  /* Überschrift: ein Treffer genügt. Teaser: erst ab zwei verschiedenen Hinweisen,
     damit eine Randbemerkung (z. B. „Mitglied im SuS“) keine Nicht-Sport-Meldung ausblendet. */
  if (SPORT_CLUB.test(it.title) || scoreMatch(it.title) || SPORT_WORDS.test(norm(it.title))) return true;
  return sportHits(it.teaser || "") >= 2;
}
function sportHits(text){
  const hits = new Set(), g = new RegExp(SPORT_WORDS.source, "g"), n = norm(text); let m;
  while ((m = g.exec(n))) hits.add(m[2]);
  const c = new RegExp(SPORT_CLUB.source, "g"); while ((m = c.exec(text))) hits.add(m[2]);
  return hits.size;
}

/* ---------- Doppelte Meldungen erkennen ---------- */
const STOP = new Set(("der die das den dem des ein eine einer eines einem einen und oder aber als auch auf aus bei bis mit nach seit von vor zum zur fuer ueber unter gegen ohne durch wie was wer wird werden wurde wurden ist sind war hat haben hatte nicht noch nur mehr schon jetzt nun doch sich sie ihr ihre sein seine man wir uns dass wenn weil denn dann hier dort heute gestern morgen neue neuen neuer neues erste ersten alle viele immer wieder soll sollen will kann koennen muss muessen live liveblog newsblog ticker video kommentar analyse interview update eilmeldung news plus diese dieser dieses beim vom ins im am an in zu so es um da ab").split(" "));
function norm(s){ return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss"); }
function tokens(title){
  const t = new Set();
  for (const w of norm(title).split(/[^a-z0-9]+/)){
    if (w.length < 3 || STOP.has(w) || /^\d+$/.test(w) && w.length < 4) continue;
    t.add(w.slice(0, 6));
  }
  return t;
}
function sim(a, b){
  let shared = 0; for (const x of a) if (b.has(x)) shared++;
  if (shared < 2) return 0;
  return shared / Math.min(a.size, b.size);
}
function cluster(items){
  const n = items.length, parent = items.map((_,i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const toks = items.map(it => tokens(it.title));
  if (settings.merge){
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){
      if (items[i].src === items[j].src) continue;
      if (Math.abs(items[i].date - items[j].date) > 36 * 3600e3) continue;
      if (sim(toks[i], toks[j]) >= 0.5) parent[find(i)] = find(j);
    }
  }
  const groups = new Map();
  items.forEach((it, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(i); });
  const clusters = [];
  for (const idx of groups.values()){
    const its = idx.map(i => items[i]).sort((a,b) => b.date - a.date);
    let best = 0, bestScore = -1;
    if (idx.length > 2){
      idx.forEach((i, k) => {
        let s = 0; idx.forEach(j => { if (i !== j) s += sim(toks[i], toks[j]); });
        s -= items[i].title.length / 1000;
        if (s > bestScore){ bestScore = s; best = k; }
      });
    }
    const lead = idx.length > 2 ? items[idx[best]] : its.reduce((a,b) => (a.title.length <= b.title.length ? a : b));
    const title = lead.title.replace(/^(\+{2,}|liveblog|newsblog|ticker|eilmeldung)[:\s+]*/i, "").replace(/\s*\+{2,}\s*$/,"");
    const teaser = (its.find(x => x.teaser && x.src === lead.src) || its.find(x => x.teaser) || {}).teaser || "";
    const counts = {};
    its.forEach(x => { counts[x.cat] = (counts[x.cat] || 0) + (x.cat === "Vermischtes" ? 0.5 : 1); });
    const cat = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    const seen = new Set();
    const list = its.filter(x => { const k = x.src + (x.via || ""); if (seen.has(k)) return false; seen.add(k); return true; });
    clusters.push({id: its.map(x => x.link).sort()[0], title, teaser, cat, date: its[0].date, items: list.map(x => ({link:x.link, name: x.via ? x.via : x.srcName, date:x.date}))});
  }
  return clusters.sort((a,b) => b.date - a.date);
}

/* ---------- Laden ---------- */
async function refresh(){
  if (state.loading) return;
  state.loading = true;
  const btn = document.getElementById("refresh"); btn.classList.add("spin");
  const active = sources.filter(s => s.on);
  let done = 0; const prog = document.getElementById("prog"); prog.style.width = "4%";
  const all = []; const status = {};
  const snap = await loadSnapshot();
  serverInfo = snap ? {at: snap.at} : {at: 0};
  await Promise.all(active.map(async s => {
    const f = snap && snap.feeds[s.url];
    try{
      let items;
      if (f && f.ok){
        items = f.items.map(r => finalize(r, s));
        status[s.id] = {ok:true, n:items.length, at:snap.at, via:"server"};
      } else {
        items = parseFeed(await fetchText(s.url, s.id), s);
        status[s.id] = {ok:true, n:items.length, at:Date.now(), via:"proxy"};
      }
      all.push(...items);
    }catch(e){
      if (f && !f.ok) e = new Error("Quelle meldet: " + (f.error || "Fehler"));
      status[s.id] = {ok:false, msg: e.name === "AbortError" ? "Zeitüberschreitung" : (e.message || "Fehler"), at:Date.now()};
      const old = cache.items.filter(i => i.src === s.id); all.push(...old);
    }
    done++; prog.style.width = Math.round(done / active.length * 100) + "%";
    if (state.view === "settings") renderSettings(status);
  }));
  const seen = new Set();
  cache = {items: all.filter(i => !seen.has(i.link) && seen.add(i.link)), at: Date.now(), dataAt: snap ? snap.at : Date.now(), status};
  store.set("cache", cache);
  pruneDismissed();
  state.loading = false; btn.classList.remove("spin");
  setTimeout(() => { prog.style.width = "0"; }, 400);
  render();
}
function pruneDismissed(){
  const limit = Date.now() - 10 * 86400e3;
  for (const k in dismissed) if (dismissed[k] < limit) delete dismissed[k];
  store.set("dismissed", dismissed);
}

function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "jetzt"; if (m < 60) return m + " Min";
  const h = Math.round(m / 60); if (h < 24) return h + " Std";
  return new Date(t).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"});
}

function dayLabel(t){

/* ---------- Toast ---------- */
let toastTimer, undoFn;
function toast(msg, undo){
  $("toastMsg").textContent = msg; undoFn = undo; $("toastUndo").hidden = !undo; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, 4500);
}
$("toastUndo").addEventListener("click", () => { if (undoFn) undoFn(); $("toast").hidden = true; });

/* ---------- Aktionen ---------- */
function findCluster(id){ return lastClusters.find(c => c.id === id) || pins.find(p => p.id === id) || readList.find(r => r.id === id); }
function collapse(slot, then){
  slot.style.height = slot.offsetHeight + "px";
  requestAnimationFrame(() => { slot.style.height = "0px"; slot.style.opacity = "0"; slot.style.marginBottom = "-10px"; });
  setTimeout(then, 260);
}
function markRead(id, slot){
  const c = findCluster(id); if (!c) return;
  const existing = readList.find(r => r.id === id);
  if (existing){ existing.readAt = Date.now(); saveRead(); return; }
  const {pinnedAt, ...rest} = c;
  readList.push({...rest, readAt: Date.now()}); saveRead(); store.set("hintSeen", true);
  const entry = logEntry(c); readLog.push(entry); saveLogs();
  if (state.view !== "feed") return;
  collapse(slot, () => {
    render();
    toast("Unter „Gelesen“ abgelegt", () => { readList = readList.filter(r => r.id !== id); readLog = readLog.filter(e => e !== entry); saveRead(); saveLogs(); render(); });
  });
}
function togglePin(id){
  const i = pins.findIndex(p => p.id === id);
  if (i >= 0){ pins.splice(i, 1); toast("Nicht mehr gemerkt"); }
  else { const c = findCluster(id); if (!c) return; pins.push({...c, pinnedAt: Date.now()}); toast("Gemerkt für später"); }
  store.set("pins", pins); render();
}
function removeAfterSwipe(slot, id){
  slot.style.height = slot.offsetHeight + "px";
  requestAnimationFrame(() => { slot.style.height = "0px"; slot.style.opacity = "0"; slot.style.marginBottom = "-10px"; });
  setTimeout(() => {
    if (state.view === "pins"){
      const idx = pins.findIndex(p => p.id === id); const removed = pins.splice(idx, 1)[0];
      store.set("pins", pins); render();
      toast("Aus „Gemerkt“ entfernt", () => { pins.push(removed); store.set("pins", pins); render(); });
    } else if (state.view === "read"){
      const removed = readList.find(r => r.id === id); if (!removed) return;
      const now = Date.now();
      readList = readList.filter(r => r.id !== id); removed.items.forEach(i => dismissed[i.link] = now);
      saveRead(); store.set("dismissed", dismissed); render();
      toast("Aus „Gelesen“ entfernt", () => { readList.push(removed); removed.items.forEach(i => delete dismissed[i.link]); saveRead(); store.set("dismissed", dismissed); render(); });
    } else {
      const c = findCluster(id); if (!c) return;
      const now = Date.now(); c.items.forEach(i => dismissed[i.link] = now);
      const entry = logEntry(c); swipeLog.push(entry); saveLogs();
      store.set("dismissed", dismissed); store.set("hintSeen", true); render();
      toast("Ausgeblendet", () => { c.items.forEach(i => delete dismissed[i.link]); swipeLog = swipeLog.filter(e => e !== entry); saveLogs(); store.set("dismissed", dismissed); render(); });
    }
  }, 260);
}

/* Wischen */
let drag = null;
document.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card"); if (!card || e.target.closest(".pin")) return;
  drag = {card, slot: card.parentElement, x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId, t: performance.now()};
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active){
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ drag = null; return; }
    if (Math.abs(dx) > 10){ drag.active = true; drag.card.classList.remove("anim"); try{ drag.card.setPointerCapture(e.pointerId); }catch(_){} }
    else return;
  }
  drag.dx = dx; drag.card.style.transform = `translateX(${dx}px) rotate(${dx / 60}deg)`;
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  if (!d.active) return;
  d.card.dataset.dragged = "1"; setTimeout(() => delete d.card.dataset.dragged, 50);
  const w = d.card.offsetWidth, v = Math.abs(d.dx) / (performance.now() - d.t);
  d.card.classList.add("anim");
  if (Math.abs(d.dx) > w * 0.35 || (v > 0.6 && Math.abs(d.dx) > 50)){
    d.card.style.transform = `translateX(${Math.sign(d.dx) * (w + 60)}px)`;
    removeAfterSwipe(d.slot, d.slot.dataset.id);
  } else d.card.style.transform = "";
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", e => { if (drag && drag.active){ drag.card.classList.add("anim"); drag.card.style.transform = ""; } drag = null; });
document.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card && card.dataset.dragged){ e.preventDefault(); e.stopPropagation(); return; }
  const pin = e.target.closest(".pin"); if (pin){ togglePin(pin.closest(".slot").dataset.id); return; }
  if (card && !e.target.closest("a")){ card.querySelector("h2 a").click(); return; }
  const link = e.target.closest(".card a"); if (link){ const slot = link.closest(".slot"); markRead(slot.dataset.id, slot); return; }
  const chip = e.target.closest(".chip"); if (chip){ state.cat = chip.dataset.cat; render(); window.scrollTo({top:0}); return; }
  const tab = e.target.closest(".tab"); if (tab){ setView(tab.dataset.view); return; }
  const segBtn = e.target.closest(".seg button"); if (segBtn){
    const key = segBtn.parentElement.dataset.set; let val = segBtn.dataset.v;
    if (key === "hours") val = Number(val);
    settings[key] = val; saveAll(); if (key === "theme") applyTheme(); render(); return;
  }
  const del = e.target.closest("[data-del]"); if (del){
    const id = del.dataset.del, idx = sources.findIndex(s => s.id === id), removed = sources[idx];
    sources.splice(idx, 1); saveAll(); render();
    toast(removed.name + " entfernt", () => { sources.splice(idx, 0, removed); saveAll(); render(); }); return;
  }
  if (e.target.id === "exportLog"){ exportLog(); return; }
  if (e.target.id === "clearRead"){
    const old = readList, oldDis = {...dismissed}, now = Date.now();
    readList.forEach(c => c.items.forEach(i => dismissed[i.link] = now));
    readList = []; saveRead(); saveAll(); render();
    toast("Bereich „Gelesen“ geleert", () => { readList = old; dismissed = oldDis; saveRead(); saveAll(); render(); }); return;
  }
  if (e.target.id === "resetDismissed"){ const old = dismissed; dismissed = {}; saveAll(); render(); toast("Ausgeblendete Meldungen werden wieder gezeigt", () => { dismissed = old; saveAll(); render(); }); return; }
  if (e.target.id === "resetSources"){
    const old = sources; sources = DEFAULT_SOURCES.map(s => ({...s})); saveAll(); render(); refresh();
    toast("Quellen zurückgesetzt", () => { sources = old; saveAll(); render(); refresh(); }); return;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.toggle){ const s = sources.find(x => x.id === t.dataset.toggle); s.on = t.checked; saveAll(); if (s.on) refresh(); else render(); }
  else if (t.id === "merge"){ settings.merge = t.checked; saveAll(); render(); }
  else if (t.id === "hideSport"){ settings.hideSport = t.checked; saveAll(); currentClusters(); render(); }
  else if (t.id === "proxySel"){ settings.proxy = t.value; saveAll(); render(); }
  else if (t.id === "customProxy"){ settings.customProxy = t.value.trim(); saveAll(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const name = $("nsName").value.trim(), url = $("nsUrl").value.trim(), cat = $("nsCat").value, err = $("addErr");
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Wird geprüft …"; err.hidden = true;
  const src = {id: "u" + Date.now().toString(36), name, url, cat, group: "Eigene", on: true};
  try{
    const items = parseFeed(await fetchText(url, src.id), src);
    if (!items.length) throw new Error("Der Feed enthält keine Meldungen.");
    sources.push(src); saveAll();
    cache.items.push(...items); cache.status[src.id] = {ok:true, n:items.length, at:Date.now()}; store.set("cache", cache);
    $("nsName").value = ""; $("nsUrl").value = "";
    toast(name + " hinzugefügt"); render();
  }catch(ex){
    err.textContent = "Unter dieser Adresse wurde kein lesbarer RSS-Feed gefunden (" + (ex.message || "Fehler") + "). Prüfe die Adresse oder versuche einen anderen Abruf-Dienst.";
    err.hidden = false; btn.disabled = false; btn.textContent = "Quelle prüfen und hinzufügen";
  }
});
async function exportLog(){
  const data = JSON.stringify({app:"NewsHub", exportiert:new Date().toISOString(), hideSport:settings.hideSport,
    quellen:sources.filter(s => s.on).map(s => s.name), weggewischt:swipeLog, gelesen:readLog}, null, 1);
  const name = "newshub-lerndaten-" + new Date().toISOString().slice(0, 10) + ".json";
  try{
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"NewsHub Lerndaten"}); return; }
  }catch(err){ if (err && err.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(data); toast("Lerndaten in die Zwischenablage kopiert"); return; }catch(err){}
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); toast("Lerndaten heruntergeladen");
}
function setView(v){
  state.view = v; state.cat = "Alle";
  document.querySelectorAll(".tab").forEach(t => { if (t.dataset.view === v) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); });
  ["feed","pins","read","settings"].forEach(n => $("view-" + n).hidden = n !== v);
  render(); window.scrollTo({top:0});
}
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - cache.at > 10 * 60e3) refresh(); });
setInterval(() => { if (!document.hidden) updateStamp(); }, 60e3);

/* ---------- Start ---------- */
applyTheme();
render();
refresh();
</script>
</body>
</html>
