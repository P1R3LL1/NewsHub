name: Feeds abrufen
 
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Feeds holen
        run: |
          mkdir -p site
          cp index.html site/
          python3 fetch_feeds.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Veröffentlichen: GitHub findet das Paket gelegentlich nicht sofort.
      # Dann nach einer Minute ein zweiter Versuch, statt den Lauf scheitern zu lassen.
      - id: deploy_first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Kurz warten
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
